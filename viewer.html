<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Viewport Lab</title>
    <link rel="icon" href="icons/32.png" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="viewer.css" />
    <script type="module" src="viewer.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="island nav">
        <button id="back" class="icon" type="button" title="Voltar" disabled>
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <button id="forward" class="icon" type="button" title="Avançar" disabled>
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
        </button>
        <button id="reload" class="icon" type="button" title="Recarregar">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
        </button>
        <span class="sep"></span>
        <form id="urlForm" class="url">
          <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Digite uma URL, ex.: localhost:3000" />
        </form>
      </div>

      <nav id="devices" class="island dock" aria-label="Dispositivos"></nav>

      <div class="island tools">
        <div class="dims" title="Largura × altura (CSS px)">
          <input id="width" type="number" min="50" max="4096" aria-label="Largura" />
          <span>×</span>
          <input id="height" type="number" min="50" max="4096" aria-label="Altura" />
        </div>
        <span class="sep"></span>
        <button id="rotate" class="icon" type="button" title="Girar (R)">
          <svg viewBox="0 0 24 24"><rect x="3" y="9" width="12" height="12" rx="2" /><path d="M12 3a8 8 0 0 1 8 8" /><path d="m17 9 3 2 2-3" /></svg>
        </button>
        <label class="zoom" title="Zoom">
        <select id="zoom" aria-label="Zoom">
          <option value="fit">Ajustar</option>
          <option value="25">25%</option>
          <option value="50">50%</option>
          <option value="75">75%</option>
          <option value="100">100%</option>
          <option value="125">125%</option>
          <option value="150">150%</option>
        </select>
        </label>
        <button id="bezel" class="icon" type="button" title="Moldura do dispositivo" aria-pressed="true">
          <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3" /><path d="M11 18h2" /></svg>
        </button>
        <button id="touch" class="icon" type="button" title="Simular toque (bolinha e arrastar para rolar)" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M22 14a8 8 0 0 1-8 8" /><path d="M18 11v-1a2 2 0 0 0-4 0" /><path d="M14 10V9a2 2 0 0 0-4 0v1" /><path d="M10 9.5V4a2 2 0 0 0-4 0v10" /><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></svg>
        </button>
        <span class="sep"></span>
        <button id="theme" class="icon" type="button" title="Alternar tema claro/escuro">
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
        </button>
        <button id="exit" class="icon danger" type="button" title="Sair (volta para a página)">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="progress"></div>
    </header>

    <main id="stage" class="stage">
      <div id="sizer" class="sizer">
        <div id="device" class="device">
          <div id="screen" class="screen">
            <iframe
              id="frame"
              title="Página em teste"
              allow="autoplay; camera; clipboard-read; clipboard-write; fullscreen; geolocation; microphone; payment"
            ></iframe>
            <div id="empty" class="empty"></div>
          </div>
        </div>
        <div class="handle handle-x" data-axis="x" title="Arraste para redimensionar"></div>
        <div class="handle handle-y" data-axis="y" title="Arraste para redimensionar"></div>
        <div class="handle handle-xy" data-axis="xy" title="Arraste para redimensionar"></div>
      </div>
      <p id="caption" class="caption"></p>
    </main>
  </body>
</html>
